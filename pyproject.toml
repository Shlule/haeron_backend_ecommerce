[project]
name = "haeron-backend-ecommerce"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "shlule", email = "erogliano@artfx.fr" }
]
dependencies = [
    "django>=5.2.8",
    "psycopg2>=2.9.11",
    "python-decouple>=3.8",
    "argon2-cffi>=25.1.0",
    "djangorestframework-simplejwt>=5.5.1",
    "strawberry-graphql-django>=0.67.2",
    "django-choices-field>=3.1.1",
    "uvicorn>=0.38.0",
    "django-allauth[mfa]>=65.14.0",
    "django-filter>=25.2",
    "django-cors-headers>=4.9.0",
    "jsonschema>=4.26.0",
    "pytest-django>=4.12.0",
    "stripe>=15.3.0",
    "django-extensions>=4.1",
    "hvac>=2.4.0",
    "cryptography>=49.0.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "faker>=40.28.1",
    "pyotp>=2.10.0",
]
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "haeron_backend.settings"
pythonpath = ["src"]

addopts = "-ra -q"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/haeron_backend"]
