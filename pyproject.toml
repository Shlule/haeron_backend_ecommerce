[project]
name = "haeron-backend-ecommerce"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "shlule", email = "erogliano@artfx.fr" }
]
dependencies = [
    "django>=5.2.8",
    "psycopg2>=2.9.11",
    "djangorestframework>=3.16.1",
    "python-decouple>=3.8",
    "argon2-cffi>=25.1.0",
    "djangorestframework-simplejwt>=5.5.1",
    "strawberry-graphql-django>=0.67.2",
    "django-choices-field>=3.1.1",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/haeron_backend_ecommerce"]
